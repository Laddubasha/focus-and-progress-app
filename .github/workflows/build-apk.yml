name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create or Fix Flutter Project Structure
        run: |
          # Checks if pubspec.yaml exists. If not, it builds a fresh app framework.
          if [ ! -f "pubspec.yaml" ] && [ ! -f "lib/main.dart" ]; then
            echo "No project found. Generating fresh Flutter template..."
            flutter create --platforms=android .
            
            # Installs the missing Google AI package to the fresh template
            flutter pub add google_generative_ai
            
            # If you uploaded a lone main.dart file, move it to the right place
            if [ -f "main.dart" ]; then
              mv main.dart lib/main.dart
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-app
          path: build/app/outputs/flutter-apk/app-release.apk
