name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find Flutter Project Directory
        id: find-dir
        run: |
          # Looks for pubspec.yaml and extracts its folder path
          DIR=$(dirname $(find . -name "pubspec.yaml" -print -quit))
          if [ "$DIR" = "." ] || [ -z "$DIR" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "path=$DIR" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.find-dir.outputs.path }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find-dir.outputs.path }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-app
          path: ${{ steps.find-dir.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
